function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cash(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function total(es){return es.reduce((v,e)=>v+Number(e.qty)*Number(e.rate),0)}
function toast(s){let x=$('#toast');x.textContent=s;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),1900)}
function acct(id=state.account){return db.accounts.find(a=>a.id===id)}
function entries(id){return id?acct(id).entries.map(e=>({...e,accountId:id,accountName:acct(id).name})):db.accounts.flatMap(a=>a.entries.map(e=>({...e,accountId:a.id,accountName:a.name})))}
function monthPrefix(){return `${state.month.getFullYear()}-${String(state.month.getMonth()+1).padStart(2,'0')}`}
function monthEntries(id){return entries(id).filter(e=>e.date.startsWith(monthPrefix()))}
function header(title){return `<div class="toolbar"><button class="back" onclick="goHome()">‹ ${t('back')}</button><b>${title}</b><span></span></div>`}
function goHome(){state.account=null;setTab('home')}
function setTab(tab){state.tab=tab;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function render(){if(state.tab==='home')home();if(state.tab==='calendar')calendar();if(state.tab==='records')records();if(state.tab==='reports')reports();if(state.tab==='settings')settings();$('#hero').textContent=state.account?acct()?.name:'Your work, clearly organised.'}
function home(){let cards=db.accounts.map(a=>{let es=monthEntries(a.id);return `<div class="card account"><div><div class="accounttop"><div class="accountname">${esc(a.name)}</div><span class="tag">${es.length} ${t('entries')}</span></div><div class="amount">${cash(total(es))}</div><div class="small">${t('monthTotal')} · ${state.month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div></div><div class="btnrow"><button class="btn full" onclick="openAccount('${a.id}')">${t('open')} →</button><button class="btn ghost" onclick="accountForm('${a.id}')">✎</button></div></div>`}).join('');
$('#view').innerHTML=`<div class="toolbar"><b class="title">${t('accounts')}</b><button class="btn" onclick="accountForm()">＋ ${t('create')}</button></div>${cards?`<div class="grid">${cards}</div>`:`<div class="empty"><div class="big">📒</div><b>${t('noAccounts')}</b><p>${t('createHint')}</p><button class="btn" onclick="accountForm()">＋ ${t('create')}</button></div>`}<div class="title" style="margin-top:22px">${t('combined')}</div><div class="card"><div class="small">${t('monthTotal')}</div><div class="amount">${cash(total(monthEntries(null)))}</div><div class="small">${state.month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div></div><div class="title" style="margin-top:22px">${t('work')}</div><div class="grid"><button class="tile" onclick="setTab('calendar')"><span class="tileicon">▦</span><span><b>${t('calendar')}</b><small>${t('daily')}</small></span></button><button class="tile" onclick="setTab('records')"><span class="tileicon">▤</span><span><b>${t('records')}</b><small>${t('full')}</small></span></button><button class="tile" onclick="setTab('reports')"><span class="tileicon">▥</span><span><b>${t('reports')}</b><small>${t('month')}</small></span></button><button class="tile" onclick="setTab('settings')"><span class="tileicon">⚙</span><span><b>${t('settings')}</b><small>${t('motorTypes')}</small></span></button></div>`}
function accountForm(id=null){let a=id?acct(id):null;$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h3>${a?t('rename'):t('create')}</h3><div class="notice">${t('createHint')}</div><div class="field"><label>${t('accountName')}</label><input id="accountInput" maxlength="60" value="${esc(a?.name||'')}" placeholder="e.g. Jay Patel"></div><div class="btnrow"><button class="btn" onclick="saveAccount('${id||''}')">${t('save')}</button><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button>${a?`<button class="btn danger" onclick="deleteAccount('${id}')">${t('delete')}</button>`:''}</div></div></div>`;$('#accountInput').focus()}
const DEFAULT_MOTORS=[['0.5 HP TP',50],['1 HP TP',50],['2 HP TP',50],['3 HP TP',50],['5 HP TP',50],['7.5 HP TP',80],['10 HP TP',100],['0.5 HP SP',70],['1 HP SP',70],['2 HP SP',70],['3 HP SP',70]];
function saveAccount(id){let name=$('#accountInput').value.trim();if(!name){toast(t('invalid'));return}if(id){acct(id).name=name}else db.accounts.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,types:DEFAULT_MOTORS.map(x=>x[0]),rates:Object.fromEntries(DEFAULT_MOTORS),entries:[]});save();closeModal();home()}
function deleteAccount(id){if(!confirm(t('confirmAccount')))return;db.accounts=db.accounts.filter(a=>a.id!==id);if(state.account===id)state.account=null;save();closeModal();home();toast(t('deleted'))}
function openAccount(id){state.account=id;state.month=new Date(today.getFullYear(),today.getMonth(),1);state.tab='calendar';setTab('calendar')}
function calendar(){if(!state.account||!acct()){let list=db.accounts.map(a=>`<button class="tile" onclick="openAccount('${a.id}')"><span class="tileicon">📒</span><span><b>${esc(a.name)}</b><small>${t('open')}</small></span></button>`).join('');$('#view').innerHTML=`<div class="title">${t('selectAccount')}</div>${list?`<div class="grid">${list}</div>`:`<div class="empty">${t('noAccounts')}<p><button class="btn" onclick="accountForm()">${t('create')}</button></p></div>`}`;return}
let m=state.month,y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate(),es=monthEntries(state.account),cells=Array(first).fill('<button class="day" disabled></button>').join('');
for(let d=1;d<=days;d++){let date=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,day=es.filter(e=>e.date===date);cells+=`<button class="day ${day.length?'has':''} ${date===iso(today)?'today':''}" onclick="openDay('${date}')"><div class="daynum">${d}</div>${day.length?`<div class="dayamt">${cash(total(day))}</div><div class="dot"></div>`:''}</button>`}
$('#view').innerHTML=`${header(esc(acct().name))}<div class="monthbar"><button onclick="shiftMonth(-1)">‹</button><b>${m.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1)">›</button></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dayname">${d}</div>`).join('')}${cells}</div><div class="stats"><div class="mini"><span class="small">${t('monthTotal')}</span><strong>${cash(total(es))}</strong></div><div class="mini"><span class="small">${t('entries')}</span><strong>${es.length}</strong></div></div><button class="btn full" onclick="openDay('${iso(today)}')">＋ ${t('addEntry')} · ${t('today')}</button>`}
function shiftMonth(n){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+n,1);calendar()}
function openDay(date){state.date=date;dailySheet()}
function dailySheet(){let a=acct(),es=a.entries.filter(e=>e.date===state.date);$('#view').innerHTML=`${header(esc(a.name)+' · '+state.date)}<div class="title">${t('daily')}</div>${es.length?es.map(e=>`<div class="entry"><div class="entrytop"><div><div class="entryname">${esc(e.type)}</div><div class="entrymath">${e.qty} × ${cash(e.rate)} ${e.note?' · '+esc(e.note):''}</div></div><div class="entryamt">${cash(e.qty*e.rate)}</div></div><div class="entrytop" style="margin-top:9px;justify-content:flex-end"><button class="iconbtn" onclick="entryForm('${e.id}')">✎ ${t('edit')}</button><button class="iconbtn" onclick="deleteEntry('${e.id}')">⌫ ${t('delete')}</button></div></div>`).join(''):`<div class="empty"><div class="big">📒</div><b>${t('noEntries')}</b><p>${t('empty')}</p></div>`}<div class="totalbox"><span><b>${t('dailyTotal')}</b><div class="small">${es.length} ${t('entries')}</div></span><strong>${cash(total(es))}</strong></div><button class="btn full" style="margin-top:13px" onclick="entryForm()">＋ ${t('addEntry')}</button>`}
function entryForm(id=null){let a=acct(),old=id?a.entries.find(e=>e.id===id):null;state.editId=id;let opts=a.types.map(x=>`<option ${old?.type===x?'selected':''}>${esc(x)}</option>`).join('');$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h3>${old?t('edit'):t('addEntry')}</h3>${!a.types.length?`<div class="notice">${t('noTypes')} <button class="btn secondary" onclick="closeModal();setTab('settings')">${t('settings')}</button></div>`:`<div class="field"><label>${t('date')}</label><input id="edate" type="date" value="${old?.date||state.date}"></div><div class="field"><label>${t('motor')}</label><select id="etype" onchange="setDefaultRate()">${opts}</select></div><div class="field"><label>${t('qty')}</label><input id="eqty" type="number" min=".01" step="any" value="${old?.qty||1}" oninput="calc()"></div><div class="field"><label>${t('rate')}</label><input id="erate" type="number" min="0" step="any" value="${old?.rate??(a.rates?.[old?.type||a.types[0]]??'')}" placeholder="e.g. 70" oninput="calc()"></div><div class="totalbox"><span>${t('amount')}</span><strong id="eamount">₹0</strong></div><div class="field"><label>${t('note')}</label><input id="enote" value="${esc(old?.note||'')}"></div><div class="notice">${t('rateHint')}</div><div class="btnrow" style="margin-top:13px"><button class="btn" onclick="saveEntry()">${t('save')}</button><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button></div>`}</div></div>`;calc()}
function setDefaultRate(){let a=acct(),type=$('#etype')?.value;if($('#erate')&&a?.rates?.[type]!==undefined){$('#erate').value=a.rates[type];calc()}}
function calc(){let q=Number($('#eqty')?.value||0),r=Number($('#erate')?.value||0);if($('#eamount'))$('#eamount').textContent=cash(q*r)}
function closeModal(){$('#modalroot').innerHTML='';state.editId=null}
function saveEntry(){let a=acct(),date=$('#edate').value,type=$('#etype').value,qty=Number($('#eqty').value),rate=Number($('#erate').value);if(!date||!type||!(qty>0)||!Number.isFinite(rate)||rate<0){toast(t('invalid'));return}let note=$('#enote').value.trim();if(state.editId)Object.assign(a.entries.find(e=>e.id===state.editId),{date,type,qty,rate,note});else a.entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),date,type,qty,rate,note});save();state.date=date;closeModal();dailySheet();toast(t('saved'))}
function deleteEntry(id){if(!confirm(t('confirmDelete')))return;acct().entries=acct().entries.filter(e=>e.id!==id);save();dailySheet();toast(t('deleted'))}
function records(){let id=state.account||'all',es=id==='all'?entries(null):entries(id);es=es.map(e=>({...e,accountName:e.accountName||acct(id).name})).sort((a,b)=>b.date.localeCompare(a.date));let q=window.rsearch||'';if(q)es=es.filter(e=>(e.accountName+' '+e.date+' '+e.type).toLowerCase().includes(q.toLowerCase()));let grouped={};es.forEach(e=>(grouped[e.date]??=[]).push(e));$('#view').innerHTML=`<div class="title">${t('full')}</div><div class="field"><label>${t('accounts')}</label><select onchange="state.account=this.value==='all'?null:this.value;records()"><option value="all" ${id==='all'?'selected':''}>${t('all')}</option>${db.accounts.map(a=>`<option value="${a.id}" ${id===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><input placeholder="${t('search')}" value="${esc(q)}" oninput="window.rsearch=this.value;records()"></div><div class="stats"><div class="mini"><span class="small">${t('total')}</span><strong>${cash(total(es))}</strong></div><div class="mini"><span class="small">${t('entries')}</span><strong>${es.length}</strong></div></div>${Object.keys(grouped).length?Object.entries(grouped).map(([date,arr])=>`<div class="title">${date} · ${cash(total(arr))}</div><div class="tablewrap"><table><thead><tr><th>${t('accounts')}</th><th>${t('motor')}</th><th>${t('qty')}</th><th>${t('rate')}</th><th>${t('amount')}</th></tr></thead><tbody>${arr.map(e=>`<tr><td>${esc(e.accountName)}</td><td>${esc(e.type)}</td><td>${e.qty}</td><td>${cash(e.rate)}</td><td>${cash(e.qty*e.rate)}</td></tr>`).join('')}</tbody></table></div>`).join(''):`<div class="empty">${t('noData')}</div>`}`}
function reports(){let from=window.rfrom||`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`,to=window.rto||iso(today),id=window.raid||'all',es=entries(null).filter(e=>e.date>=from&&e.date<=to&&(id==='all'||e.accountId===id));let motor={};es.forEach(e=>{let a=acct(e.accountId),k=(a?.name||'')+' · '+e.type;(motor[k]??={qty:0,total:0}).qty+=Number(e.qty);motor[k].total+=e.qty*e.rate});$('#view').innerHTML=`<div class="title">${t('reports')}</div><div class="card"><div class="reportfilters"><div><label>${t('from')}</label><input type="date" value="${from}" onchange="window.rfrom=this.value;reports()"></div><div><label>${t('to')}</label><input type="date" value="${to}" onchange="window.rto=this.value;reports()"></div><div style="grid-column:1/-1"><label>${t('accounts')}</label><select onchange="window.raid=this.value;reports()"><option value="all">${t('all')}</option>${db.accounts.map(a=>`<option value="${a.id}" ${id===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div></div><div class="totalbox"><span><b>${t('rangeTotal')}</b><div class="small">${es.length} ${t('entries')}</div></span><strong>${cash(total(es))}</strong></div></div><div class="title">${t('motorWise')}</div>${Object.keys(motor).length?`<div class="tablewrap"><table><thead><tr><th>${t('motor')}</th><th>${t('units')}</th><th>${t('total')}</th></tr></thead><tbody>${Object.entries(motor).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.qty}</td><td>${cash(v.total)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('noData')}</div>`}<div class="btnrow"><button class="btn" onclick="downloadCSV()">${t('csv')}</button><button class="btn secondary" onclick="window.print()">${t('pdf')}</button></div>`}
function downloadCSV(){let from=window.rfrom||'0000',to=window.rto||'9999',id=window.raid||'all',es=entries(null).filter(e=>e.date>=from&&e.date<=to&&(id==='all'||e.accountId===id));let rows=[['Account','Date','Motor Type','Quantity','Rate','Amount','Note'],...es.map(e=>[acct(e.accountId)?.name||'',e.date,e.type,e.qty,e.rate,e.qty*e.rate,e.note||''])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');blob('\ufeff'+csv,'hisab-kitab-report.csv','text/csv;charset=utf-8')}
function blob(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function settings(){let a=acct();if(a&&!a.rates){a.rates={};a.types.forEach(x=>a.rates[x]=50);save()}$('#view').innerHTML=`<div class="title">${t('settings')}</div><div class="card"><div class="entrytop"><b>${t('motorTypes')} ${a?'· '+esc(a.name):''}</b></div>${a?`${a.types.map((x,i)=>`<div class="settingrow"><span>${esc(x)}</span><span style="display:flex;gap:6px;align-items:center"><input aria-label="Default rate for ${esc(x)}" type="number" min="0" style="width:82px;padding:7px;border:1px solid #dfe6f1;border-radius:8px" value="${Number(a.rates?.[x]??0)}" onchange="setRate('${esc(x)}',this.value)"><button class="iconbtn" onclick="removeType(${i})">${t('delete')}</button></span></div>`).join('')}<button class="btn full" style="margin-top:12px" onclick="typeForm()">＋ ${t('addType')}</button>`:`<p class="small">${t('selectAccount')}</p><button class="btn" onclick="setTab('home')">${t('home')}</button>`}</div><div class="card" style="margin-top:12px"><b>${t('backup')} & ${t('restore')}</b><p class="small">${t('dataNote')}</p><div class="btnrow"><button class="btn" onclick="backup()">${t('backup')}</button><button class="btn secondary" onclick="$('#restoreFile').click()">${t('restore')}</button><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="restore(this.files[0])"></div></div><div class="foot">HISAB KITAB · Version 2.0</div>`}
function typeForm(){let a=acct();$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h3>${t('addType')}</h3><div class="field"><label>${t('typeName')}</label><input id="typeInput" placeholder="e.g. 7.5 HP SP"></div><div class="field"><label>${t('rate')}</label><input id="typeRate" type="number" min="0" value="50"></div><div class="btnrow"><button class="btn" onclick="saveType()">${t('save')}</button><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button></div></div></div>`}
function saveType(){let a=acct(),v=$('#typeInput').value.trim(),r=Number($('#typeRate').value);if(!v||!Number.isFinite(r)||r<0)return;if(a.types.some(x=>x.toLowerCase()===v.toLowerCase())){toast('Already exists');return}a.types.push(v);a.rates=a.rates||{};a.rates[v]=r;a.types.sort((x,y)=>x.localeCompare(y,undefined,{numeric:true}));save();closeModal();settings()}
function setRate(type,value){let a=acct(),r=Number(value);if(!a||!Number.isFinite(r)||r<0)return;a.rates=a.rates||{};a.rates[type]=r;save();toast(t('saved'))}
function removeType(i){let a=acct(),v=a.types[i];if(a.entries.some(e=>e.type===v)){toast(t('typeUsed'));return}if(confirm(t('confirmDelete'))){a.types.splice(i,1);save();settings()}}
function backup(){blob(JSON.stringify(db,null,2),'hisab-kitab-backup.json','application/json');toast(t('backupDone'))}
function restore(file){if(!file||!confirm(t('restoreAsk')))return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.accounts))throw Error();db=x;save();render();toast(t('restoreDone'))}catch(e){alert('Invalid backup file')}};r.readAsText(file)}
$('#language').addEventListener('change',e=>{state.lang=e.target.value;document.documentElement.lang=state.lang;render();$$('[data-i]').forEach(el=>el.textContent=t(el.dataset.i))});
$$('.nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
render();$$('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
